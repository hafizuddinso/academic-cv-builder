<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-label="Monochrome Academic CV Builder interface with fictional CV data">
<rect width="1200" height="690" fill="#f4f4f3"/>
<rect width="210" height="690" fill="#111"/>
<text x="28" y="40" font-family="Arial" font-size="17" fill="white" font-weight="bold">ACADEMIC CV</text>
<text x="28" y="59" font-family="Arial" font-size="10" fill="#888">CV BUILDER</text>
<text x="28" y="115" font-family="Arial" font-size="10" fill="#777" letter-spacing="1.5">CV SECTIONS</text>
<rect x="13" y="137" width="181" height="38" rx="3" fill="white"/>
<text x="27" y="161" font-family="Arial" font-size="13" fill="#111">01  Identity</text>
<g font-family="Arial" font-size="13" fill="#aaa"><text x="27" y="206">02  Profile</text><text x="27" y="250">03  Education</text><text x="27" y="294">04  Research</text><text x="27" y="338">05  Experience</text><text x="27" y="382">06  Additional</text></g>
<text x="28" y="645" font-family="Arial" font-size="10" fill="#888">SAVED IN YOUR BROWSER</text>
<rect x="210" y="0" width="990" height="62" fill="#fff"/><text x="240" y="37" font-family="Arial" font-size="12" fill="#555">EDIT CV  /  IDENTITY</text><text x="1090" y="37" font-family="Arial" font-size="12" fill="#222" text-anchor="end">NO ACCOUNT REQUIRED</text>
<line x1="773" y1="62" x2="773" y2="690" stroke="#dedede"/>
<text x="251" y="121" font-family="Arial" font-size="11" fill="#888" letter-spacing="1.4">STEP 01 / 06</text>
<text x="251" y="168" font-family="Arial" font-size="35" fill="#171717" font-weight="bold">Personal details</text>
<text x="251" y="195" font-family="Arial" font-size="12" fill="#777">Your academic identity, links and contact information.</text>
<line x1="251" y1="227" x2="748" y2="227" stroke="#ddd"/>
<text x="251" y="264" font-family="Arial" font-size="12" fill="#111" font-weight="bold">About you</text>
<g font-family="Arial" font-size="11" fill="#444"><text x="251" y="313">Full name</text><text x="510" y="313">Location</text><text x="251" y="397">Academic headline</text><text x="251" y="482">Email</text><text x="510" y="482">GitHub</text></g>
<g fill="#fff" stroke="#ddd"><rect x="251" y="325" width="232" height="42"/><rect x="510" y="325" width="238" height="42"/><rect x="251" y="409" width="497" height="42"/><rect x="251" y="494" width="232" height="42"/><rect x="510" y="494" width="238" height="42"/></g>
<g font-family="Arial" font-size="13" fill="#333"><text x="265" y="351">Alex Example</text><text x="524" y="351">Example City, Country</text><text x="265" y="435">PhD Researcher · Sustainable Computing</text><text x="265" y="520">researcher@example.com</text><text x="524" y="520">github.com/example</text></g>
<text x="807" y="98" font-family="Arial" font-size="10" fill="#555" font-weight="bold" letter-spacing="1">LIVE DOCUMENT PREVIEW</text>
<rect x="802" y="126" width="365" height="528" fill="white" stroke="#eee"/>
<g font-family="Arial" fill="#111" text-anchor="middle"><text x="984" y="163" font-size="18" font-weight="bold">ALEX EXAMPLE</text><text x="984" y="182" font-size="9">PhD Researcher · Sustainable Computing</text><text x="984" y="195" font-size="8">Example University · researcher@example.com</text></g>
<g fill="#222" font-family="Arial" font-size="11" font-weight="bold"><text x="825" y="235">RESEARCH PROFILE</text><text x="825" y="315">EDUCATION</text><text x="825" y="421">RESEARCH EXPERIENCE</text><text x="825" y="540">SKILLS</text></g>
<g stroke="#222"><line x1="825" y1="242" x2="1143" y2="242"/><line x1="825" y1="322" x2="1143" y2="322"/><line x1="825" y1="428" x2="1143" y2="428"/><line x1="825" y1="547" x2="1143" y2="547"/></g>
<g fill="#999"><rect x="825" y="255" width="313" height="5"/><rect x="825" y="266" width="282" height="5"/><rect x="825" y="277" width="301" height="5"/><rect x="825" y="337" width="310" height="6"/><rect x="825" y="352" width="275" height="5"/><rect x="825" y="367" width="308" height="5"/><rect x="825" y="444" width="304" height="5"/><rect x="825" y="455" width="279" height="5"/><rect x="825" y="466" width="294" height="5"/><rect x="825" y="562" width="287" height="5"/><rect x="825" y="576" width="302" height="5"/></g>
